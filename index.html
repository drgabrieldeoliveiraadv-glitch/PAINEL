function detectarTribunalPorNumero(numero){
  // Formato CNJ: NNNNNNN-DD.AAAA.J.TR.OOOO — dígito J = segmento de justiça, TR = tribunal
  const limpo = (numero||"").replace(/\D/g,"");
  if(limpo.length<20) return "TJRJ";
  const j = limpo[13];
  const tr = limpo.slice(14,16);
  if(j==="8" && tr==="19") return "TJRJ";
  if(j==="8" && tr==="26") return "TJSP";
  if(j==="4" && tr==="02") return "TRF2";
  if(j==="5") return "TST";
  return "TJRJ";
}

// ---------- Utilitários ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

const fmtData = (iso) => {
  if(!iso) return "—";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
};
const fmtDataHoje = () => new Date().toISOString().slice(0,10);
const fmtMoeda = (v) => {
  if(v===null||v===undefined||v==="") return "—";
  return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
};
const fmtCPF = (v) => {
  const d = (v||"").replace(/\D/g,"").slice(0,11);
  if(d.length<=3) return d;
  if(d.length<=6) return `${d.slice(0,3)}.${d.slice(3)}`;
  if(d.length<=9) return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6)}`;
  return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`;
};
const fmtTelefone = (v) => {
  const d = (v||"").replace(/\D/g,"").slice(0,11);
  if(d.length<=2) return d;
  if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
};
const diasEntre = (isoAlvo) => {
  if(!isoAlvo) return null;
  const hoje = new Date(fmtDataHoje()+"T00:00:00");
  const alvo = new Date(isoAlvo+"T00:00:00");
  return Math.round((alvo-hoje)/86400000);
};
// Conta apenas dias úteis (segunda a sexta) entre hoje e a data-alvo.
// Não desconta feriados nacionais/estaduais — apenas fins de semana.
const diasUteisEntre = (isoAlvo) => {
  if(!isoAlvo) return null;
  const hoje = new Date(fmtDataHoje()+"T00:00:00");
  const alvo = new Date(isoAlvo+"T00:00:00");
  if(alvo.getTime()===hoje.getTime()) return 0;
  const passado = alvo < hoje;
  const inicio = passado ? alvo : hoje;
  const fim = passado ? hoje : alvo;
  let contador = 0;
  const cursor = new Date(inicio);
  while(cursor < fim){
    cursor.setDate(cursor.getDate()+1);
    const diaSemana = cursor.getDay();
    if(diaSemana!==0 && diaSemana!==6) contador++;
  }
  return passado ? -contador : contador;
};
// Escolhe dias úteis ou dias corridos conforme o tipo (labels.diasUteis)
const calcularDiasPrazo = (isoAlvo, usarDiasUteis) => usarDiasUteis ? diasUteisEntre(isoAlvo) : diasEntre(isoAlvo);
const corPrazo = (dias) => {
  if(dias===null) return "var(--text3)";
  if(dias<0) return "var(--red)";
  if(dias<=3) return "var(--red)";
  if(dias<=7) return "#B8863A";
  return "var(--green)";
};

// ---------- Persistência (Supabase quando configurado, senão window.storage) ----------
async function stGet(key, fallback){
  if(supabaseConfigurado && SB_USER_ID){
    const {data,error} = await sb.from("dados_sistema").select("valor").eq("user_id",SB_USER_ID).eq("chave",key).maybeSingle();
    if(error || !data) return fallback;
    return data.valor;
  }
  try{
    const r = await window.storage.get(key, false);
    if(!r || r.value===undefined) return fallback;
    return JSON.parse(r.value);
  }catch(e){ return fallback; }
}
async function stSet(key, value){
  if(supabaseConfigurado && SB_USER_ID){
    const {error} = await sb.from("dados_sistema").upsert({user_id:SB_USER_ID, chave:key, valor:value, atualizado_em:new Date().toISOString()});
    if(error) console.error("Erro ao salvar no Supabase", key, error);
    return;
  }
  try{ await window.storage.set(key, JSON.stringify(value), false); }
  catch(e){ console.error("Erro ao salvar", key, e); }
}

// ---------- Integração: DataJud (CNJ) — busca pública de andamentos ----------
async function buscarAndamentosDataJud(numeroProcesso, apiKey){
  if(!apiKey) throw new Error("Configure sua chave pública do DataJud em Configurações.");
  const numeroLimpo = (numeroProcesso||"").replace(/\D/g,"");
  if(numeroLimpo.length<20) throw new Error("Número de processo inválido para consulta.");
  const tribunal = detectarTribunalPorNumero(numeroProcesso);
  const endpoint = DATAJUD_ENDPOINTS[tribunal] || DATAJUD_ENDPOINTS.TJRJ;
  const resp = await fetch(endpoint, {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`APIKey ${apiKey}`},
    body: JSON.stringify({query:{match:{numeroProcesso:numeroLimpo}}})
  });
  if(!resp.ok) throw new Error(`DataJud retornou erro ${resp.status}. Verifique a chave em Configurações.`);
  const data = await resp.json();
  const hits = data?.hits?.hits || [];
  if(hits.length===0) return [];
  const fonte = hits[0]._source || {};
  const movimentos = fonte.movimentos || [];
  return movimentos
    .map(m=>({data:(m.dataHora||"").slice(0,10), desc: m.nome || "Movimentação", fonte:"datajud"}))
    .filter(m=>m.data)
    .sort((a,b)=>a.data.localeCompare(b.data));
}

// ---------- Integração: DJEN — Diário de Justiça Eletrônico Nacional (busca pública por OAB) ----------
async function buscarIntimacoesDJEN({oabNumero, oabUf, dias=15}){
  if(!oabNumero || !oabUf) throw new Error("Informe seu número e UF da OAB em Configurações.");
  const hoje = new Date();
  const inicio = new Date(hoje.getTime()-dias*86400000);
  const fmt = (d)=>d.toISOString().slice(0,10);
  const url = `https://comunicaapi.pje.jus.br/api/v1/comunicacao?numeroOab=${encodeURIComponent(oabNumero)}&ufOab=${encodeURIComponent(oabUf)}&dataDisponibilizacaoInicio=${fmt(inicio)}&dataDisponibilizacaoFim=${fmt(hoje)}`;
  const resp = await fetch(url);
  if(!resp.ok) throw new Error(`DJEN retornou erro ${resp.status}.`);
  const data = await resp.json();
  const itens = data?.items || data?.content || [];
  return itens.map(it=>({
    id: it.id || uid(),
    data: (it.data_disponibilizacao || it.dataDisponibilizacao || "").slice(0,10),
    orgao: it.orgao?.nome || it.nomeOrgao || "—",
    numeroProcesso: it.numero_processo || it.numeroProcesso || "",
    texto: it.texto || it.conteudo || "",
    vinculada:false
  }));
}

function limparNumeroProcesso(numero){ return (numero||"").replace(/\D/g,""); }

// Busca publicações da OAB no DJEN e usa para: (1) atualizar andamentos de processos já
// cadastrados, (2) cadastrar automaticamente processos que apareceram numa publicação mas
// ainda não existem no sistema, e (3) buscar movimentações oficiais no DataJud para os
// processos tocados nesta sincronização.
async function sincronizarProcessosPorOab({oabNumero, oabUf, processos, intimacoes, datajudApiKey}){
  const publicacoes = await buscarIntimacoesDJEN({oabNumero, oabUf, dias:30});

  let processosLocais = [...processos];
  let intimacoesLocais = [...intimacoes];
  const idsTocados = new Set();
  let criados = 0, atualizados = 0;

  for(const pub of publicacoes){
    const numeroLimpo = limparNumeroProcesso(pub.numeroProcesso);
    if(!numeroLimpo) continue;

    let idx = processosLocais.findIndex(p=>limparNumeroProcesso(p.numero)===numeroLimpo);
    const descAndamento = `Publicação DJEN: ${(pub.texto||"").slice(0,300)}`;

    if(idx===-1){
      const novo = {
        id:uid(), numero:pub.numeroProcesso, clienteId:"", sistema:"PJe", classificacao:"",
        vara: pub.orgao||"", autor:"", reu:"", assunto:"", valorCausa:"", prazo:"", prazoAto:"",
        obs:"Processo cadastrado automaticamente a partir de uma publicação/intimação da sua OAB. Confira e complete os dados (cliente, vara, partes).",
        arquivado:false, andamentos:[{data:pub.data||fmtDataHoje(), desc:descAndamento}]
      };
      processosLocais = [...processosLocais, novo];
      idx = processosLocais.length-1;
      criados++;
    }else{
      const jaTem = (processosLocais[idx].andamentos||[]).some(a=>a.data===pub.data && a.desc===descAndamento);
      if(!jaTem){
        processosLocais = processosLocais.map((p,i)=> i===idx ? {...p, andamentos:[...(p.andamentos||[]), {data:pub.data||fmtDataHoje(), desc:descAndamento}]} : p);
        atualizados++;
      }
    }

    idsTocados.add(processosLocais[idx].id);

    const jaEstaNasIntimacoes = intimacoesLocais.some(i=>i.id===pub.id);
    if(jaEstaNasIntimacoes){
      intimacoesLocais = intimacoesLocais.map(i=> i.id===pub.id ? {...i, vinculada:true, processoId:processosLocais[idx].id} : i);
    }else{
      intimacoesLocais = [{...pub, vinculada:true, processoId:processosLocais[idx].id}, ...intimacoesLocais];
    }
  }

  if(datajudApiKey){
    for(const id of idsTocados){
      const p = processosLocais.find(x=>x.id===id);
      if(!p || !p.numero) continue;
      try{
        const movimentos = await buscarAndamentosDataJud(p.numero, datajudApiKey);
        const jaExistem = new Set((p.andamentos||[]).map(a=>`${a.data}|${a.desc}`));
        const novos = movimentos.filter(a=>!jaExistem.has(`${a.data}|${a.desc}`));
        if(novos.length>0){
          processosLocais = processosLocais.map(x=> x.id===id ? {...x, andamentos:[...(x.andamentos||[]), ...novos]} : x);
        }
      }catch(e){ /* segue para o próximo processo mesmo se um falhar */ }
    }
  }

  return {processosLocais, intimacoesLocais, resumo:{criados, atualizados, totalPublicacoes:publicacoes.length}};
}

// ---------- Integração: Google Agenda ----------
function inicializarGoogle(clientId, onToken){
  if(!clientId || !window.google?.accounts?.oauth2) return null;
  return window.google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: "https://www.googleapis.com/auth/calendar.events",
    callback: (resp) => { if(resp.access_token) onToken(resp.access_token); }
  });
}
async function criarEventoGoogle(accessToken, compromisso){
  const inicio = `${compromisso.data}T${compromisso.hora||"09:00"}:00`;
  const fim = `${compromisso.data}T${(compromisso.hora||"09:00")}:00`;
  const evento = {
    summary: compromisso.titulo,
    location: compromisso.local||"",
    description: compromisso.obs||"",
    start:{dateTime: inicio, timeZone:"America/Sao_Paulo"},
    end:{dateTime: fim, timeZone:"America/Sao_Paulo"},
  };
  const resp = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${accessToken}`},
    body: JSON.stringify(evento)
  });
  if(!resp.ok) throw new Error("Não foi possível criar o evento no Google Agenda.");
  return resp.json();
}

function TelaLoginSupabase({onLogin}){

  const enviar = async (e) => {
    e.preventDefault();
    setErro(""); setAviso(""); setCarregando(true);
    if(modo==="entrar"){
      const {data,error} = await sb.auth.signInWithPassword({email,password:senha});
      if(error){ setErro(error.message==="Invalid login credentials"?"E-mail ou senha incorretos.":error.message); setCarregando(false); return; }
      onLogin(data.user);
    }else{
      const {data,error} = await sb.auth.signUp({email,password:senha});
      if(error){ setErro(error.message); setCarregando(false); return; }
      if(data.session){ onLogin(data.user); }

            {carregando?"Aguarde…":modo==="entrar"?"Entrar":"Criar conta"}
          </button>
        </form>
        <div onClick={()=>{setModo(modo==="entrar"?"criar":"entrar");setErro("");setAviso("");}} style={{textAlign:"center",fontSize:13,color:"var(--navy)",marginTop:18,cursor:"pointer",fontWeight:600}}>

function TelaLoginLocal({onLogin}){
  const [nome,setNome] = useState("");
  const [senha,setSenha] = useState("");
  const [erro,setErro] = useState("");
  const [carregando,setCarregando] = useState(false);

  const entrar = async (e) => {
    e.preventDefault();
    setErro("");
    if(!nome.trim()){ setErro("Informe seu nome de usuário."); return; }
    setCarregando(true);
    const usuarios = await stGet("usuarios", null);
    if(usuarios===null){
      // primeiro acesso: cria o usuário admin
      const novo = {nome:nome.trim(), senha, criadoEm:fmtDataHoje()};
      await stSet("usuarios",[novo]);
      await stSet("sessao", novo.nome);
      setCarregando(false);
      onLogin(novo.nome);
      return;
    }
    const existente = usuarios.find(u=>u.nome.toLowerCase()===nome.trim().toLowerCase());
    if(existente){
      if(existente.senha && existente.senha!==senha){
        setErro("Senha incorreta.");
        setCarregando(false);
        return;
      }
      await stSet("sessao", existente.nome);
      onLogin(existente.nome);
    }else{
      const novo = {nome:nome.trim(), senha, criadoEm:fmtDataHoje()};
      await stSet("usuarios",[...usuarios,novo]);
      await stSet("sessao", novo.nome);
      onLogin(novo.nome);
    }
    setCarregando(false);
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(160deg, var(--navy) 0%, var(--navy2) 55%, #1a3358 100%)",padding:20}}>

          <LogoMarca size={230}/>
        </div>
        <div style={{textAlign:"center",fontSize:13,fontStyle:"italic",color:"var(--text2)",marginBottom:28,lineHeight:1.5}}>
          "{IDENTIDADE.slogan}"
        </div>
        <form onSubmit={entrar}>
          <label style={{fontSize:12,color:"var(--text2)",fontWeight:600,textTransform:"uppercase",letterSpacing:.5}}>Usuário</label>
          <input value={nome} onChange={e=>setNome(e.target.value)} placeholder="seu nome"
            style={{width:"100%",padding:"11px 12px",marginTop:6,marginBottom:16,borderRadius:8,border:"1px solid var(--border2)",fontSize:15,outline:"none"}}/>
          <label style={{fontSize:12,color:"var(--text2)",fontWeight:600,textTransform:"uppercase",letterSpacing:.5}}>Senha (opcional)</label>
          <input type="password" value={senha} onChange={e=>setSenha(e.target.value)} placeholder="••••••••"
            style={{width:"100%",padding:"11px 12px",marginTop:6,marginBottom:22,borderRadius:8,border:"1px solid var(--border2)",fontSize:15,outline:"none"}}/>
          {erro && <div style={{color:"var(--red)",fontSize:13,marginBottom:14}}>{erro}</div>}
          <button disabled={carregando} type="submit" style={{width:"100%",padding:"13px",borderRadius:8,border:"none",background:"var(--navy)",color:"var(--gold-light)",fontSize:15,fontWeight:600,letterSpacing:.5,cursor:"pointer",fontFamily:"'Cinzel',serif"}}>
            {carregando?"Entrando…":"Entrar"}
          </button>
        </form>
        <div style={{textAlign:"center",fontSize:11,color:"var(--text3)",marginTop:24}}>
          Sistema de gestão interno · uso restrito à equipe
        </div>
      </div>
    </div>
  );
}

function PaginaDashboard({processos,setProcessos,sindicancias,setSindicancias,peps,setPeps,clientes,setClientes,tarefas,setTarefas,agenda,setAgenda,parcelas,onIrPara,onAbrirProcesso}){
  // Resumo de prazos por categoria, cada uma com sua regra de contagem (dias úteis x dias corridos)
  const resumoPrazos = (lista, usarDiasUteis) => {
    const ativosComPrazo = lista.filter(p=>!p.arquivado && p.prazo);
    const comDias = ativosComPrazo.map(p=>({...p, dias: calcularDiasPrazo(p.prazo, usarDiasUteis)}));
    return {
      total: comDias.length,
      vencidos: comDias.filter(p=>p.dias<0).length,
      proximos7: comDias.filter(p=>p.dias>=0 && p.dias<=7).length,
      itens: comDias,
    };
  };

  const resumoProcessos = useMemo(()=>resumoPrazos(processos, true), [processos]);
  const resumoSindicancias = useMemo(()=>resumoPrazos(sindicancias, false), [sindicancias]);
  const resumoPeps = useMemo(()=>resumoPrazos(peps, false), [peps]);

  const prazosProximos = useMemo(()=>{
    const todos = [
      ...resumoProcessos.itens.map(p=>({...p, tipo:"Processo", pagina:"processos"})),
      ...resumoSindicancias.itens.map(p=>({...p, tipo:"Sindicância", pagina:"sindicancias"})),
      ...resumoPeps.itens.map(p=>({...p, tipo:"PEP", pagina:"peps"})),
    ];
    return todos.sort((a,b)=>a.dias-b.dias).slice(0,8);
  },[resumoProcessos,resumoSindicancias,resumoPeps]);

  const tarefasAbertas = tarefas.filter(t=>t.status!=="concluida" && !t.arquivada);
  const processosAtivos = processos.filter(p=>!p.arquivado);
  const parcelasEmAberto = parcelas.filter(p=>!p.pago);
  const totalReceber = parcelasEmAberto.reduce((s,p)=>s+(Number(p.valor)||0),0);

  const [perguntaIA,setPerguntaIA] = useState("");
  const [respostaIA,setRespostaIA] = useState("");
  const [carregandoIA,setCarregandoIA] = useState(false);
  const [comBuscaIA,setComBuscaIA] = useState(false);
  const [fontesIA,setFontesIA] = useState([]);
  const [acoesExecutadas,setAcoesExecutadas] = useState([]);

  // Executa uma lista de ações pedidas pela IA em sequência, mantendo cópias locais
  // para que uma ação (ex: criar cliente) já esteja disponível para a próxima (ex: criar processo para ele).
  const executarAcoesIA = (acoes) => {
    let clientesLocais = [...clientes];
    let processosLocais = [...processos];
    let sindicanciasLocais = [...sindicancias];
    let pepsLocais = [...peps];
    let tarefasLocais = [...tarefas];
    let agendaLocais = [...agenda];
    const mensagens = [];

    const encontrarCliente = (nome) => {
      if(!nome) return null;
      const alvo = nome.trim().toLowerCase();
      return clientesLocais.find(c=>c.nome.toLowerCase().includes(alvo)) || null;
    };

    for(const acao of acoes){
      try{
        if(acao.acao==="criar_cliente" && acao.nome){
          const novo = {id:uid(), nome:acao.nome, cpfCnpj:acao.cpfCnpj||"", telefone:acao.telefone||"", email:acao.email||"", endereco:acao.endereco||"", profissao:acao.profissao||"", estadoCivil:acao.estadoCivil||"", obs:"Cadastrado pela IA."};
          clientesLocais = [...clientesLocais, novo];
          mensagens.push(`Cliente "${acao.nome}" cadastrado.`);
        }
        else if(acao.acao==="criar_tarefa" && acao.titulo){
          tarefasLocais = [...tarefasLocais, {id:uid(), titulo:acao.titulo, processoId:"", prazo:acao.prazo||"", status:"afazer", obs:"Criada pela IA.", arquivada:false}];
          mensagens.push(`Tarefa criada: "${acao.titulo}"${acao.prazo?` com prazo em ${fmtData(acao.prazo)}`:""}.`);
        }
        else if(acao.acao==="criar_compromisso" && acao.titulo && acao.data){
          agendaLocais = [...agendaLocais, {id:uid(), titulo:acao.titulo, data:acao.data, hora:acao.hora||"09:00", local:acao.local||"", processoId:"", obs:"Criado pela IA."}];
          mensagens.push(`Compromisso agendado: "${acao.titulo}" em ${fmtData(acao.data)}${acao.hora?` às ${acao.hora}`:""}.`);
        }
        else if((acao.acao==="criar_processo"||acao.acao==="criar_sindicancia"||acao.acao==="criar_pep") && acao.clienteNome){
          const cliente = encontrarCliente(acao.clienteNome);
          if(!cliente){
            mensagens.push(`Não encontrei um cliente chamado "${acao.clienteNome}" — peça para eu cadastrar o cliente primeiro (ex: "cadastra o cliente ${acao.clienteNome} e depois cria o processo").`);
          }else{
            const novoItem = {id:uid(), numero:acao.numero||"", clienteId:cliente.id, sistema: acao.acao==="criar_processo"?"PJe":"Extrajudicial", classificacao:"", vara:"", autor:"", reu:"", assunto:acao.assunto||"", valorCausa:"", prazo:acao.prazo||"", prazoAto:acao.prazoAto||"", obs:"Criado pela IA.", arquivado:false, andamentos:[]};
            const rotulo = acao.acao==="criar_processo"?"Processo":acao.acao==="criar_sindicancia"?"Sindicância":"PEP";
            if(acao.acao==="criar_processo") processosLocais = [...processosLocais, novoItem];
            if(acao.acao==="criar_sindicancia") sindicanciasLocais = [...sindicanciasLocais, novoItem];
            if(acao.acao==="criar_pep") pepsLocais = [...pepsLocais, novoItem];
            mensagens.push(`${rotulo} criado(a) para ${cliente.nome}${acao.numero?` (nº ${acao.numero})`:""}.`);
          }
        }
        else if(acao.acao==="concluir_tarefa" && acao.tituloTarefa){
          const alvo = acao.tituloTarefa.trim().toLowerCase();
          const idx = tarefasLocais.findIndex(t=>t.titulo.toLowerCase().includes(alvo) && t.status!=="concluida");
          if(idx>=0){
            const tituloAchado = tarefasLocais[idx].titulo;
            tarefasLocais = tarefasLocais.map((t,i)=>i===idx?{...t,status:"concluida"}:t);
            mensagens.push(`Tarefa "${tituloAchado}" marcada como concluída.`);
          }else{
            mensagens.push(`Não encontrei uma tarefa em aberto parecida com "${acao.tituloTarefa}".`);
          }
        }
      }catch(e){ /* ignora ação individual malformada e segue para a próxima */ }
    }

    setClientes(clientesLocais);
    setProcessos(processosLocais);
    setSindicancias(sindicanciasLocais);
    setPeps(pepsLocais);
    setTarefas(tarefasLocais);
    setAgenda(agendaLocais);
    return mensagens;
  };

  const perguntarIA = async () => {
    if(!perguntaIA.trim()) return;
    setCarregandoIA(true); setRespostaIA(""); setFontesIA([]); setAcoesExecutadas([]);
    const systemPrompt = `Você é um assistente jurídico para um escritório de advocacia brasileiro especializado em Direito Médico, no Rio de Janeiro. Responda de forma direta, prática e em português. Se a pergunta pedir um documento ou minuta completa, sugira usar o "Gerador de Peças" para isso e dê só um resumo rápido aqui. Nunca invente fatos, números de processo ou dados específicos que não foram fornecidos.${comBuscaIA?" Pesquise na internet para fundamentar a resposta, priorizando o Jusbrasil para jurisprudência, e cite as fontes ao final.":""}

Além de responder perguntas, você pode executar ações diretamente no sistema quando o usuário pedir claramente. Para cada ação, inclua na resposta um bloco separado <<ACAO>>{...}<<FIM_ACAO>> (pode incluir mais de um bloco se o pedido envolver várias ações, por exemplo cadastrar um cliente e já criar um processo para ele). Ações disponíveis:
- Criar cliente: <<ACAO>>{"acao":"criar_cliente","nome":"...","cpfCnpj":"opcional","telefone":"opcional","email":"opcional","endereco":"opcional"}<<FIM_ACAO>>
- Criar tarefa: <<ACAO>>{"acao":"criar_tarefa","titulo":"...","prazo":"AAAA-MM-DD ou vazio"}<<FIM_ACAO>>
- Agendar compromisso: <<ACAO>>{"acao":"criar_compromisso","titulo":"...","data":"AAAA-MM-DD","hora":"HH:MM ou vazio","local":"opcional"}<<FIM_ACAO>>
- Criar processo judicial: <<ACAO>>{"acao":"criar_processo","clienteNome":"nome do cliente já cadastrado","numero":"opcional","assunto":"opcional","prazo":"AAAA-MM-DD opcional","prazoAto":"opcional"}<<FIM_ACAO>>
- Criar sindicância: <<ACAO>>{"acao":"criar_sindicancia","clienteNome":"...","numero":"opcional","assunto":"opcional","prazo":"AAAA-MM-DD opcional"}<<FIM_ACAO>>
- Criar PEP: <<ACAO>>{"acao":"criar_pep","clienteNome":"...","numero":"opcional","assunto":"opcional","prazo":"AAAA-MM-DD opcional"}<<FIM_ACAO>>
- Concluir tarefa existente: <<ACAO>>{"acao":"concluir_tarefa","tituloTarefa":"parte do título da tarefa"}<<FIM_ACAO>>
Hoje é ${fmtDataHoje()}. Use essa data como referência para calcular datas relativas ("amanhã", "sexta-feira", etc.). Para criar processo/sindicância/PEP, o cliente precisa já existir ou ser criado no mesmo pedido (nesse caso inclua o bloco de criar_cliente ANTES do bloco do processo). Inclua blocos <<ACAO>> apenas quando o pedido for claramente para criar/alterar algo, e escreva uma frase curta de confirmação junto. Se não for um pedido de ação, responda normalmente, sem nenhum bloco <<ACAO>>.`;
    try{
      const {texto,fontes} = await chamarIA(systemPrompt, perguntaIA.trim(), comBuscaIA);
      const matches = [...texto.matchAll(/<<ACAO>>([\s\S]*?)<<FIM_ACAO>>/g)];
      let textoLimpo = texto.replace(/<<ACAO>>[\s\S]*?<<FIM_ACAO>>/g,"").trim();
      if(matches.length>0){
        const acoes = [];
        for(const m of matches){
          try{ acoes.push(JSON.parse(m[1])); }catch(e){ /* ignora bloco malformado */ }
        }
        if(acoes.length>0){
          const mensagens = executarAcoesIA(acoes);
          setAcoesExecutadas(mensagens);
        }
      }
      setRespostaIA(textoLimpo || "Feito!");
      setFontesIA(fontes||[]);
    }catch(e){
      setRespostaIA("Não foi possível obter uma resposta agora. Tente novamente em instantes.");
    }
    setCarregandoIA(false);
  };

  const CaixaPrazo = ({titulo, resumo, cor, icon, pagina, regra}) => (
    <div onClick={()=>onIrPara(pagina)} style={{
      background:"var(--card)",borderRadius:12,padding:"18px 20px",boxShadow:"var(--shadow)",
      border:"1px solid var(--border)",flex:1,minWidth:220,cursor:"pointer"
    }}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <Icon name={icon} size={16} color={cor}/>
          <span style={{fontSize:14.5,fontWeight:700,color:"var(--text)"}}>{titulo}</span>
        </div>
        <span style={{fontSize:10.5,color:"var(--text3)",textTransform:"uppercase",letterSpacing:.3}}>{regra}</span>
      </div>
      <div style={{display:"flex",gap:18}}>
        <div>
          <div style={{fontSize:26,fontWeight:700,fontFamily:"'Cormorant Garamond',serif",color:"var(--text)"}}>{resumo.total}</div>
          <div style={{fontSize:11,color:"var(--text3)"}}>com prazo</div>
        </div>
        <div>
          <div style={{fontSize:26,fontWeight:700,fontFamily:"'Cormorant Garamond',serif",color: resumo.vencidos>0?"var(--red)":"var(--text3)"}}>{resumo.vencidos}</div>
          <div style={{fontSize:11,color:"var(--text3)"}}>vencido(s)</div>
        </div>
        <div>
          <div style={{fontSize:26,fontWeight:700,fontFamily:"'Cormorant Garamond',serif",color: resumo.proximos7>0?"#B8863A":"var(--text3)"}}>{resumo.proximos7}</div>
          <div style={{fontSize:11,color:"var(--text3)"}}>em 7 dias</div>
        </div>
      </div>
    </div>
  );

  return (
    <div className="fade-in">
      <h2 style={{fontSize:30,marginBottom:4}}>Painel</h2>
      <div style={{color:"var(--text2)",marginBottom:22,fontSize:14.5}}>Visão geral do escritório — {new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</div>

      <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:18}}>
        <KpiCard label="Processos ativos" value={processosAtivos.length} icon="processos" onClick={()=>onIrPara("processos")}/>
        <KpiCard label="Clientes" value={clientes.length} icon="clientes"/>
        <KpiCard label="Tarefas em aberto" value={tarefasAbertas.length} icon="tarefas" cor={tarefasAbertas.length>0?"var(--gold-dark)":"var(--navy)"}/>
        <KpiCard label="A receber" value={fmtMoeda(totalReceber)} icon="financeiro" sub={`${parcelasEmAberto.length} parcela(s) em aberto`}/>
      </div>

      <div style={{fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:.4,color:"var(--text2)",marginBottom:8,marginTop:8}}>Prazos por categoria</div>
      <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:26}}>
        <CaixaPrazo titulo="Processos" resumo={resumoProcessos} cor="var(--navy)" icon="processos" pagina="processos" regra="dias úteis"/>
        <CaixaPrazo titulo="Sindicâncias" resumo={resumoSindicancias} cor="var(--gold-dark)" icon="escudo" pagina="sindicancias" regra="dias corridos"/>
        <CaixaPrazo titulo="PEP" resumo={resumoPeps} cor="var(--gold-dark)" icon="balanca" pagina="peps" regra="dias corridos"/>
      </div>

      <div style={{background:"linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%)",borderRadius:12,padding:"20px 22px",marginBottom:22,boxShadow:"var(--shadow)"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
          <Icon name="ia" size={18} color="var(--gold-light)"/>
          <h3 style={{fontSize:18,color:"#fff"}}>Pergunte à IA</h3>
        </div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <input
            value={perguntaIA}
            onChange={e=>setPerguntaIA(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&!carregandoIA&&perguntarIA()}
            placeholder="Ex: resuma os prazos mais urgentes / o que é um agravo de instrumento?"
            style={{flex:1,minWidth:220,padding:"11px 14px",borderRadius:8,border:"none",fontSize:14.5,outline:"none"}}/>
          <button onClick={perguntarIA} disabled={carregandoIA} style={{padding:"11px 20px",borderRadius:8,border:"none",background:"var(--gold)",color:"var(--navy)",fontWeight:700,fontSize:14,cursor:"pointer",whiteSpace:"nowrap"}}>
            {carregandoIA?(comBuscaIA?"Pesquisando…":"Pensando…"):"Perguntar"}
          </button>
        </div>
        <label style={{display:"flex",alignItems:"center",gap:7,fontSize:12.5,color:"rgba(255,255,255,0.75)",marginTop:10,cursor:"pointer"}}>
          <input type="checkbox" checked={comBuscaIA} onChange={e=>setComBuscaIA(e.target.checked)}/>
          Fundamentar com pesquisa na web (Jusbrasil, legislação, jurisprudência)
        </label>
        {acoesExecutadas.length>0 && (
          <div style={{marginTop:16,display:"flex",flexDirection:"column",gap:6}}>
            {acoesExecutadas.map((msg,i)=>(
              <div key={i} style={{background:"rgba(62,150,90,0.25)",border:"1px solid rgba(62,150,90,0.5)",borderRadius:8,padding:"12px 16px",color:"#fff",fontSize:14,display:"flex",alignItems:"center",gap:8}}>
                <Icon name="check" size={15} color="#8FE0A8"/> {msg}
              </div>
            ))}
          </div>
        )}
        {respostaIA && (
          <div style={{marginTop:16,background:"rgba(255,255,255,0.08)",borderRadius:8,padding:"14px 16px",color:"#fff",fontSize:14.5,lineHeight:1.6,whiteSpace:"pre-wrap"}}>
            {respostaIA}
          </div>
        )}
        {fontesIA.length>0 && (
          <div style={{marginTop:10}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:.4,color:"rgba(255,255,255,0.5)",marginBottom:6}}>Fontes pesquisadas</div>
            {fontesIA.map((f,i)=>(
              <div key={i} style={{fontSize:12.5,marginBottom:3}}>
                <a href={f.url} target="_blank" rel="noreferrer" style={{color:"var(--gold-light)"}}>{f.titulo}</a>
              </div>
            ))}
          </div>
        )}
        <div style={{marginTop:10,fontSize:12,color:"rgba(255,255,255,0.55)"}}>
          Para gerar uma peça completa (petição, contestação, parecer...), use o <span onClick={()=>onIrPara("pecas")} style={{textDecoration:"underline",cursor:"pointer",color:"var(--gold-light)"}}>Gerador de Peças</span>.
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1.3fr 1fr",gap:18}}>
        <div style={{background:"var(--card)",borderRadius:12,padding:"20px 22px",boxShadow:"var(--shadow)",border:"1px solid var(--border)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <h3 style={{fontSize:19}}>Prazos mais próximos</h3>
          </div>
          {prazosProximos.length===0 && <div style={{color:"var(--text3)",fontSize:14,padding:"18px 0"}}>Nenhum prazo cadastrado no momento.</div>}
          {prazosProximos.map(p=>(
            <div key={`${p.tipo}-${p.id}`} onClick={()=>onIrPara(p.pagina)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid var(--border)",cursor:"pointer"}}>
              <div style={{minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:10,fontWeight:700,color:"var(--text3)",textTransform:"uppercase"}}>{p.tipo}</span>
                </div>
                <div style={{fontSize:14.5,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.numero || `${p.tipo} sem número`}</div>
                <div style={{fontSize:12.5,color:"var(--text3)"}}>{p.assunto || p.classificacao || "—"}</div>
              </div>
              <Badge texto={p.dias<0?`${Math.abs(p.dias)}d atrasado`:p.dias===0?"hoje":`${p.dias}d`} cor={corPrazo(p.dias)}/>
            </div>
          ))}
        </div>

        <div style={{background:"var(--card)",borderRadius:12,padding:"20px 22px",boxShadow:"var(--shadow)",border:"1px solid var(--border)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <h3 style={{fontSize:19}}>Tarefas em aberto</h3>
            <span onClick={()=>onIrPara("tarefas")} style={{fontSize:12.5,color:"var(--navy)",cursor:"pointer",fontWeight:600}}>Ver todas →</span>
          </div>
          {tarefasAbertas.length===0 && <div style={{color:"var(--text3)",fontSize:14,padding:"18px 0"}}>Nenhuma tarefa em aberto.</div>}
          {tarefasAbertas.slice(0,8).map(t=>(
            <div key={t.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid var(--border)"}}>
              <div style={{fontSize:14.5,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"75%"}}>{t.titulo}</div>
              <Badge texto={t.status==="fazendo"?"em curso":"a fazer"} cor={t.status==="fazendo"?"var(--gold-dark)":"var(--text3)"}/>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ---------- Modal: Formulário de Cliente ----------
function ModalFormCliente({cliente,onSave,onClose}){
  const [f,setF] = useState(cliente || {nome:"",cpfCnpj:"",telefone:"",email:"",endereco:"",profissao:"",estadoCivil:"",obs:""});
  const s = (campo,valor) => setF({...f,[campo]:valor});
  const salvar = (e) => {
    e.preventDefault();
    if(!f.nome.trim()) return;
    onSave({...f, id: f.id || uid()});
  };
  return (
    <Modal titulo={cliente?"Editar cliente":"Novo cliente"} onClose={onClose}>
      <form onSubmit={salvar}>
        <label style={labelStyle}>Nome completo *</label>
        <input required style={campoStyle} value={f.nome} onChange={e=>s("nome",e.target.value)}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <div>
            <label style={labelStyle}>CPF/CNPJ</label>
            <input style={campoStyle} value={f.cpfCnpj} onChange={e=>s("cpfCnpj",fmtCPF(e.target.value))}/>
          </div>
          <div>
            <label style={labelStyle}>Telefone</label>
            <input style={campoStyle} value={f.telefone} onChange={e=>s("telefone",fmtTelefone(e.target.value))}/>
          </div>
        </div>
        <label style={labelStyle}>E-mail</label>
        <input type="email" style={campoStyle} value={f.email} onChange={e=>s("email",e.target.value)}/>
        <label style={labelStyle}>Endereço</label>
        <input style={campoStyle} value={f.endereco} onChange={e=>s("endereco",e.target.value)}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <div>
            <label style={labelStyle}>Profissão</label>
            <input style={campoStyle} value={f.profissao} onChange={e=>s("profissao",e.target.value)}/>
          </div>
          <div>
            <label style={labelStyle}>Estado civil</label>
            <input style={campoStyle} value={f.estadoCivil} onChange={e=>s("estadoCivil",e.target.value)}/>
          </div>
        </div>
        <label style={labelStyle}>Observações</label>
        <textarea rows={3} style={{...campoStyle,resize:"vertical"}} value={f.obs} onChange={e=>s("obs",e.target.value)}/>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:8}}>
          <button type="button" style={btnSecundario} onClick={onClose}>Cancelar</button>
          <button type="submit" style={btnPrimario}>Salvar</button>
        </div>
      </form>
    </Modal>
  );
}

// ---------- Página: Clientes ----------
function PaginaClientes({clientes,setClientes,processos,onAbrirProcesso}){
  const [busca,setBusca] = useState("");
  const [editando,setEditando] = useState(null);
  const [novo,setNovo] = useState(false);
  const [excluirAlvo,setExcluirAlvo] = useState(null);

  const salvar = (form) => {
    setClientes(cs => {
      const existe = cs.some(c=>c.id===form.id);
      return existe ? cs.map(c=>c.id===form.id?form:c) : [...cs,form];
    });
    setEditando(null); setNovo(false);
  };
  const excluir = (c) => {
    setClientes(cs=>cs.filter(x=>x.id!==c.id));
    setExcluirAlvo(null);
  };

  const filtrados = clientes.filter(c=>
    !busca.trim() || c.nome.toLowerCase().includes(busca.toLowerCase()) || (c.cpfCnpj||"").includes(busca)
  );

  const processosDoCliente = (clienteId) => processos.filter(p=>p.clienteId===clienteId && !p.arquivado).length;

  const copiarQualificacao = (c) => {
    const txt = `${c.nome}${c.estadoCivil?`, ${c.estadoCivil}`:""}${c.profissao?`, ${c.profissao}`:""}${c.cpfCnpj?`, portador(a) do CPF/CNPJ nº ${c.cpfCnpj}`:""}${c.endereco?`, residente e domiciliado(a) em ${c.endereco}`:""}.`;
    navigator.clipboard?.writeText(txt);
  };

  return (
    <div className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{fontSize:30}}>Clientes</h2>
          <div style={{color:"var(--text2)",fontSize:14.5}}>{clientes.length} cliente(s) cadastrado(s)</div>
        </div>
        <button onClick={()=>setNovo(true)} style={{...btnPrimario,display:"flex",alignItems:"center",gap:7}}>
          <Icon name="mais" size={15} color="#fff"/> Novo cliente
        </button>
      </div>

      <div style={{position:"relative",marginBottom:18,maxWidth:360}}>
        <div style={{position:"absolute",left:12,top:11,color:"var(--text3)"}}><Icon name="buscar" size={16}/></div>
        <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar por nome ou CPF/CNPJ..."
          style={{width:"100%",padding:"10px 12px 10px 36px",borderRadius:8,border:"1px solid var(--border2)",fontSize:14.5,outline:"none"}}/>
      </div>

      <div style={{background:"var(--card)",borderRadius:12,boxShadow:"var(--shadow)",border:"1px solid var(--border)",overflow:"hidden"}}>
        {filtrados.length===0 && <div style={{padding:30,textAlign:"center",color:"var(--text3)"}}>Nenhum cliente encontrado.</div>}
        {filtrados.map((c,i)=>(
          <div key={c.id} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 20px",borderBottom: i<filtrados.length-1?"1px solid var(--border)":"none"}}>
            <div style={{width:38,height:38,borderRadius:"50%",background:"var(--gold-light)",color:"var(--navy)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontFamily:"'Cormorant Garamond',serif",fontSize:17}}>
              {c.nome.charAt(0).toUpperCase()}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:15.5}}>{c.nome}</div>
              <div style={{fontSize:12.5,color:"var(--text3)"}}>{c.cpfCnpj||"sem CPF/CNPJ"} {c.telefone?`· ${c.telefone}`:""}</div>
            </div>
            <div className="hide-mobile" style={{fontSize:12.5,color:"var(--text2)"}}>{processosDoCliente(c.id)} processo(s)</div>
            <button onClick={()=>copiarQualificacao(c)} title="Copiar qualificação" style={{...btnSecundario,padding:"7px 10px",fontSize:12}}>Qualificação</button>
            <button onClick={()=>setEditando(c)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text2)"}}><Icon name="editar" size={16}/></button>
            <button onClick={()=>setExcluirAlvo(c)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text3)"}}><Icon name="excluir" size={16}/></button>
          </div>
        ))}
      </div>

      {(novo||editando) && (
        <ModalFormCliente cliente={editando} onSave={salvar} onClose={()=>{setNovo(false);setEditando(null);}}/>
      )}
      {excluirAlvo && (
        <Modal titulo="Excluir cliente" onClose={()=>setExcluirAlvo(null)} largura={420}>
          <p style={{fontSize:15}}>Tem certeza que deseja excluir <b>{excluirAlvo.nome}</b>? Esta ação não remove os processos vinculados a ele.</p>
          <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:16}}>
            <button style={btnSecundario} onClick={()=>setExcluirAlvo(null)}>Cancelar</button>
            <button style={btnPerigo} onClick={()=>excluir(excluirAlvo)}>Excluir</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

const CLASSIFICACOES_PADRAO = ["Responsabilidade Civil Médica","Ética Médica (CFM/CRM)","Contrato de Prestação de Serviços Médicos","Erro Médico","Consultivo","Cível Geral","Outro"];

// ---------- Modal: Formulário de Processo ----------
function ModalFormProcesso({processo,clientes,onSave,onClose,onNovoCliente,labels=LABELS_PROCESSO}){
  const [f,setF] = useState(processo || {
    numero:"", clienteId:"", sistema:"PJe", classificacao:"", vara:"",
    autor:"", reu:"", assunto:"", valorCausa:"", prazo:"", prazoAto:"", obs:""
  });
  const [buscaCliente,setBuscaCliente] = useState("");
  const s = (campo,valor) => setF({...f,[campo]:valor});

  const salvar = (e) => {
    e.preventDefault();
    if(!f.clienteId){ alert(`Selecione o ${labels.clienteLabel.toLowerCase()}.`); return; }
    onSave({...f, id: f.id || uid(), arquivado: f.arquivado||false, andamentos: f.andamentos||[]});
  };

  const clientesFiltrados = clientes.filter(c=>!buscaCliente.trim()||c.nome.toLowerCase().includes(buscaCliente.toLowerCase()));

  return (
    <Modal titulo={processo?labels.editar:labels.novo} onClose={onClose} largura={620}>
      <form onSubmit={salvar}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <div>
            <label style={labelStyle}>{labels.numero}</label>
            <input style={campoStyle} value={f.numero} onChange={e=>s("numero",e.target.value)} placeholder={labels.numeroPlaceholder}/>
          </div>
          <div>
            <label style={labelStyle}>Sistema</label>
            <select style={campoStyle} value={f.sistema} onChange={e=>s("sistema",e.target.value)}>
              <option>PJe</option><option>Eproc</option><option>Projudi</option><option>CRM-RJ</option><option>CFM</option><option>Extrajudicial</option><option>Outro</option>
            </select>
          </div>
        </div>

        <label style={labelStyle}>{labels.clienteLabel} *</label>
        <input style={{...campoStyle,marginBottom:6}} placeholder="Buscar cliente..." value={buscaCliente} onChange={e=>setBuscaCliente(e.target.value)}/>
        <select required style={campoStyle} value={f.clienteId} onChange={e=>s("clienteId",e.target.value)}>
          <option value="">Selecione...</option>
          {clientesFiltrados.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
        </select>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <div>
            <label style={labelStyle}>Autor</label>
            <input style={campoStyle} value={f.autor} onChange={e=>s("autor",e.target.value)}/>
          </div>
          <div>
            <label style={labelStyle}>Réu</label>
            <input style={campoStyle} value={f.reu} onChange={e=>s("reu",e.target.value)}/>
          </div>
        </div>

        <label style={labelStyle}>Classificação</label>
        <select style={campoStyle} value={f.classificacao} onChange={e=>s("classificacao",e.target.value)}>
          <option value="">Selecione...</option>
          {CLASSIFICACOES_PADRAO.map(c=><option key={c}>{c}</option>)}
        </select>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <div>
            <label style={labelStyle}>Vara/Comarca</label>
            <input style={campoStyle} value={f.vara} onChange={e=>s("vara",e.target.value)} placeholder="Ex: 2ª Vara Cível de Itaboraí"/>
          </div>
          <div>
            <label style={labelStyle}>Valor da causa</label>
            <input type="number" step="0.01" style={campoStyle} value={f.valorCausa} onChange={e=>s("valorCausa",e.target.value)}/>
          </div>
        </div>

        <label style={labelStyle}>Assunto</label>
        <input style={campoStyle} value={f.assunto} onChange={e=>s("assunto",e.target.value)}/>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <div>
            <label style={labelStyle}>Prazo (data)</label>
            <input type="date" style={campoStyle} value={f.prazo} onChange={e=>s("prazo",e.target.value)}/>
          </div>
          <div>
            <label style={labelStyle}>Ato do prazo</label>
            <input style={campoStyle} value={f.prazoAto} onChange={e=>s("prazoAto",e.target.value)} placeholder="Ex: Contestação"/>
          </div>
        </div>

        <label style={labelStyle}>Observações</label>
        <textarea rows={3} style={{...campoStyle,resize:"vertical"}} value={f.obs} onChange={e=>s("obs",e.target.value)}/>

        <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:8}}>
          <button type="button" style={btnSecundario} onClick={onClose}>Cancelar</button>
          <button type="submit" style={btnPrimario}>Salvar</button>
        </div>
      </form>
    </Modal>
  );
}

// ---------- Modal: Detalhe do processo ----------
function ModalDetalheProcesso({p,cliente,onClose,onEdit,onExcluir,onAddAndamento,onCumprirPrazo,onToggleArquivado,datajudApiKey,labels=LABELS_PROCESSO}){
  const [novoAnd,setNovoAnd] = useState("");
  const [confirmarExcluir,setConfirmarExcluir] = useState(false);
  const [buscandoDataJud,setBuscandoDataJud] = useState(false);
  const [erroDataJud,setErroDataJud] = useState("");
  const dias = calcularDiasPrazo(p.prazo, labels.diasUteis);

  const addAndamento = () => {
    if(!novoAnd.trim()) return;
    onAddAndamento(p.id,{data:fmtDataHoje(),desc:novoAnd.trim()});
    setNovoAnd("");
  };

  const buscarNoDataJud = async () => {
    setErroDataJud(""); setBuscandoDataJud(true);
    try{
      const encontrados = await buscarAndamentosDataJud(p.numero, datajudApiKey);
      if(encontrados.length===0){ setErroDataJud("Nenhuma movimentação encontrada para este número no DataJud."); }
      else{
        const jaExistem = new Set((p.andamentos||[]).map(a=>`${a.data}|${a.desc}`));
        const novos = encontrados.filter(a=>!jaExistem.has(`${a.data}|${a.desc}`));
        if(novos.length===0){ setErroDataJud("Nenhuma movimentação nova além das já registradas."); }
        else novos.forEach(a=>onAddAndamento(p.id,a));
      }
    }catch(e){ setErroDataJud(e.message||"Erro ao consultar o DataJud."); }
    setBuscandoDataJud(false);
  };

  return (
    <Modal titulo={p.numero||labels.semNumero} onClose={onClose} largura={640}>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
        <Badge texto={p.sistema||"sistema não definido"} cor="var(--navy)"/>
        {p.classificacao && <Badge texto={p.classificacao} cor="var(--gold-dark)"/>}
        {p.arquivado && <Badge texto="arquivado" cor="var(--text3)"/>}
        {p.prazo && <Badge texto={dias<0?`prazo vencido há ${Math.abs(dias)}d`:dias===0?"prazo hoje":`prazo em ${dias}d`} cor={corPrazo(dias)}/>}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,fontSize:14.5,marginBottom:18}}>
        <div><span style={{color:"var(--text3)"}}>{labels.clienteLabel.split(" neste")[0].split(" nesta")[0]}: </span><b>{cliente?.nome||"—"}</b></div>
        <div><span style={{color:"var(--text3)"}}>Vara: </span>{p.vara||"—"}</div>
        <div><span style={{color:"var(--text3)"}}>Autor: </span>{p.autor||"—"}</div>
        <div><span style={{color:"var(--text3)"}}>Réu: </span>{p.reu||"—"}</div>
        <div><span style={{color:"var(--text3)"}}>Assunto: </span>{p.assunto||"—"}</div>
        <div><span style={{color:"var(--text3)"}}>Valor da causa: </span>{fmtMoeda(p.valorCausa)}</div>
      </div>

      {p.prazo && (
        <div style={{background:"var(--bg2)",borderRadius:9,padding:"12px 14px",marginBottom:18,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontWeight:600,fontSize:14.5}}>{p.prazoAto||"Prazo"}: {fmtData(p.prazo)}</div>
          </div>
          <button onClick={()=>onCumprirPrazo(p.id)} style={{...btnSecundario,fontSize:12.5,padding:"7px 12px",display:"flex",alignItems:"center",gap:5}}>
            <Icon name="check" size={13}/> Marcar cumprido
          </button>
        </div>
      )}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <h4 style={{fontSize:16}}>Andamentos</h4>
        {labels.mostrarDataJud && p.numero && (
          <button onClick={buscarNoDataJud} disabled={buscandoDataJud} style={{...btnSecundario,fontSize:12,padding:"6px 11px",display:"flex",alignItems:"center",gap:6}}>
            <Icon name="sync" size={13}/> {buscandoDataJud?"Consultando…":"Buscar no DataJud"}
          </button>
        )}
      </div>
      {erroDataJud && <div style={{fontSize:12.5,color:"var(--red)",marginBottom:10}}>{erroDataJud}</div>}
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <input value={novoAnd} onChange={e=>setNovoAnd(e.target.value)} placeholder="Registrar novo andamento..."
          onKeyDown={e=>e.key==="Enter"&&addAndamento()}
          style={{...campoStyle,margin:0,flex:1}}/>
        <button onClick={addAndamento} style={{...btnPrimario,whiteSpace:"nowrap"}}>Adicionar</button>
      </div>
      <div style={{maxHeight:200,overflowY:"auto",marginBottom:10}}>
        {(!p.andamentos || p.andamentos.length===0) && <div style={{color:"var(--text3)",fontSize:14}}>Nenhum andamento registrado.</div>}
        {(p.andamentos||[]).slice().reverse().map((a,i)=>(
          <div key={i} style={{display:"flex",gap:12,padding:"9px 0",borderBottom:"1px solid var(--border)"}}>
            <div style={{fontSize:12.5,color:"var(--text3)",minWidth:75}}>{fmtData(a.data)}</div>
            <div style={{fontSize:14}}>{a.desc}</div>
          </div>
        ))}
      </div>

      {p.obs && <><h4 style={{fontSize:16,marginTop:18,marginBottom:8}}>Observações</h4><div style={{fontSize:14,color:"var(--text2)",whiteSpace:"pre-wrap"}}>{p.obs}</div></>}

      <div style={{display:"flex",gap:10,justifyContent:"space-between",marginTop:22,flexWrap:"wrap"}}>
        <button onClick={()=>onToggleArquivado(p.id)} style={btnSecundario}>{p.arquivado?"Desarquivar":"Arquivar"}</button>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setConfirmarExcluir(true)} style={btnPerigo}>Excluir</button>
          <button onClick={()=>onEdit(p)} style={btnPrimario}>Editar</button>
        </div>
      </div>

      {confirmarExcluir && (
        <Modal titulo={labels.excluirTitulo} onClose={()=>setConfirmarExcluir(false)} largura={400}>
          <p>{labels.excluirTexto}</p>
          <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:16}}>
            <button style={btnSecundario} onClick={()=>setConfirmarExcluir(false)}>Cancelar</button>
            <button style={btnPerigo} onClick={()=>{onExcluir(p.id);setConfirmarExcluir(false);onClose();}}>Excluir</button>
          </div>
        </Modal>
      )}
    </Modal>
  );
}

// ---------- Página: Processos ----------
function PaginaProcessos({processos,setProcessos,clientes,setClientes,abrirProcessoId,onProcessoAberto,datajudApiKey,intimacoes,setIntimacoes,oabNumero,oabUf,labels=LABELS_PROCESSO}){
  const [busca,setBusca] = useState("");
  const [filtroStatus,setFiltroStatus] = useState("ativos");
  const [novo,setNovo] = useState(false);
  const [editando,setEditando] = useState(null);
  const [detalheId,setDetalheId] = useState(abrirProcessoId||null);
  const [buscandoOab,setBuscandoOab] = useState(false);
  const [resultadoOab,setResultadoOab] = useState(null);
  const [erroOab,setErroOab] = useState("");

  useEffect(()=>{ if(abrirProcessoId){ setDetalheId(abrirProcessoId); onProcessoAberto&&onProcessoAberto(); } },[abrirProcessoId]);

  const buscarPorOab = async () => {
    setErroOab(""); setResultadoOab(null); setBuscandoOab(true);
    try{
      const {processosLocais, intimacoesLocais, resumo} = await sincronizarProcessosPorOab({oabNumero, oabUf, processos, intimacoes, datajudApiKey});
      setProcessos(processosLocais);
      setIntimacoes(intimacoesLocais);
      setResultadoOab(resumo);
    }catch(e){
      setErroOab(e.message || "Erro ao buscar publicações pela OAB.");
    }
    setBuscandoOab(false);
  };

  const clientePorId = (id) => clientes.find(c=>c.id===id);

  const salvar = (form) => {
    setProcessos(ps=>{
      const existe = ps.some(p=>p.id===form.id);
      return existe ? ps.map(p=>p.id===form.id?form:p) : [...ps,form];
    });
    setNovo(false); setEditando(null);
  };
  const excluir = (id) => setProcessos(ps=>ps.filter(p=>p.id!==id));
  const addAndamento = (id,and) => setProcessos(ps=>ps.map(p=>p.id===id?{...p,andamentos:[...(p.andamentos||[]),and]}:p));
  const cumprirPrazo = (id) => setProcessos(ps=>ps.map(p=>p.id===id?{...p,prazo:"",prazoAto:"",andamentos:[...(p.andamentos||[]),{data:fmtDataHoje(),desc:`Prazo "${p.prazoAto||''}" cumprido.`}]}:p));
  const toggleArquivado = (id) => setProcessos(ps=>ps.map(p=>p.id===id?{...p,arquivado:!p.arquivado}:p));

  const filtrados = processos.filter(p=>{
    if(filtroStatus==="ativos" && p.arquivado) return false;
    if(filtroStatus==="arquivados" && !p.arquivado) return false;
    if(!busca.trim()) return true;
    const cli = clientePorId(p.clienteId);
    const alvo = `${p.numero} ${p.assunto} ${p.autor} ${p.reu} ${cli?.nome||""}`.toLowerCase();
    return alvo.includes(busca.toLowerCase());
  }).sort((a,b)=>{
    const da = a.prazo ? calcularDiasPrazo(a.prazo, labels.diasUteis) : 9999;
    const db = b.prazo ? calcularDiasPrazo(b.prazo, labels.diasUteis) : 9999;
    return da-db;
  });

  const processoDetalhe = detalheId ? processos.find(p=>p.id===detalheId) : null;

  return (
    <div className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{fontSize:30}}>{labels.tituloPagina}</h2>
          <div style={{color:"var(--text2)",fontSize:14.5}}>{filtrados.length} {labels.contagem} {filtroStatus==="ativos"?"ativo(s)":filtroStatus==="arquivados"?"arquivado(s)":""}</div>
        </div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          {labels.mostrarDataJud && (
            <button onClick={buscarPorOab} disabled={buscandoOab} style={{...btnSecundario,display:"flex",alignItems:"center",gap:7}}>
              <Icon name="sync" size={14}/> {buscandoOab?"Buscando…":"Buscar por OAB"}
            </button>
          )}
          <button onClick={()=>setNovo(true)} style={{...btnPrimario,display:"flex",alignItems:"center",gap:7}}>
            <Icon name="mais" size={15} color="#fff"/> {labels.novo}
          </button>
        </div>
      </div>

      {erroOab && <div style={{color:"var(--red)",fontSize:13.5,marginBottom:14}}>{erroOab}</div>}
      {resultadoOab && (
        <div style={{background:"var(--bg2)",borderRadius:9,padding:"11px 16px",fontSize:13.5,marginBottom:18}}>
          {resultadoOab.totalPublicacoes===0
            ? "Nenhuma publicação encontrada para sua OAB nos últimos 30 dias."
            : `${resultadoOab.totalPublicacoes} publicação(ões) encontrada(s): ${resultadoOab.criados} processo(s) novo(s) cadastrado(s) automaticamente, ${resultadoOab.atualizados} processo(s) existente(s) atualizado(s).`}
          {resultadoOab.criados>0 && " Confira os processos novos e complete os dados de cliente/vara/partes."}
        </div>
      )}

      <div style={{display:"flex",gap:12,marginBottom:18,flexWrap:"wrap",alignItems:"center"}}>
        <div style={{position:"relative",flex:1,minWidth:220,maxWidth:360}}>
          <div style={{position:"absolute",left:12,top:11,color:"var(--text3)"}}><Icon name="buscar" size={16}/></div>
          <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder={labels.buscaPlaceholder}
            style={{width:"100%",padding:"10px 12px 10px 36px",borderRadius:8,border:"1px solid var(--border2)",fontSize:14.5,outline:"none"}}/>
        </div>
        <div style={{display:"flex",gap:6}}>
          {[["ativos","Ativos"],["arquivados","Arquivados"],["todos","Todos"]].map(([v,l])=>(
            <button key={v} onClick={()=>setFiltroStatus(v)} style={{
              padding:"8px 14px",borderRadius:20,border:"1px solid var(--border2)",fontSize:13,cursor:"pointer",
              background: filtroStatus===v?"var(--navy)":"#fff", color: filtroStatus===v?"#fff":"var(--text2)"
            }}>{l}</button>
          ))}
        </div>
      </div>

      <div style={{background:"var(--card)",borderRadius:12,boxShadow:"var(--shadow)",border:"1px solid var(--border)",overflow:"hidden"}}>

function PaginaAgenda({agenda,setAgenda,processos,clientes,googleToken}){
  const [novo,setNovo] = useState(false);
  const [editando,setEditando] = useState(null);
  const [sincronizando,setSincronizando] = useState(false);
  const [erroSync,setErroSync] = useState("");

  const salvar = (form) => {
    setAgenda(ag=>{
      const existe = ag.some(a=>a.id===form.id);
      return existe ? ag.map(a=>a.id===form.id?form:a) : [...ag,form];
    });
    setNovo(false); setEditando(null);
  };
  const excluir = (id) => setAgenda(ag=>ag.filter(a=>a.id!==id));

  const sincronizarGoogle = async () => {
    setErroSync(""); setSincronizando(true);
    const pendentes = agenda.filter(a=>!a.googleSynced && diasEntre(a.data)>=0);
    try{
      for(const compromisso of pendentes){
        await criarEventoGoogle(googleToken, compromisso);
        setAgenda(ag=>ag.map(a=>a.id===compromisso.id?{...a,googleSynced:true}:a));
      }
    }catch(e){ setErroSync(e.message||"Erro ao sincronizar com o Google Agenda."); }
    setSincronizando(false);
  };

  const ordenados = [...agenda].sort((a,b)=> (a.data+a.hora).localeCompare(b.data+b.hora));
  const futuros = ordenados.filter(a=>diasEntre(a.data)>=0);
  const passados = ordenados.filter(a=>diasEntre(a.data)<0);

  const Item = ({a}) => {
    const proc = processos.find(p=>p.id===a.processoId);
    const dias = diasEntre(a.data);
    return (
      <div style={{display:"flex",gap:14,alignItems:"center",padding:"13px 18px",borderBottom:"1px solid var(--border)"}}>
        <div style={{width:56,textAlign:"center"}}>
          <div style={{fontSize:20,fontWeight:700,color:"var(--navy)",fontFamily:"'Cormorant Garamond',serif",lineHeight:1}}>{a.data.slice(8,10)}</div>
          <div style={{fontSize:11,color:"var(--text3)",textTransform:"uppercase"}}>{new Date(a.data+"T00:00:00").toLocaleDateString("pt-BR",{month:"short"})}</div>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,fontSize:15}}>{a.titulo}</div>
          <div style={{fontSize:12.5,color:"var(--text3)"}}>{a.hora||"—"} {a.local?`· ${a.local}`:""} {proc?`· ${proc.numero}`:""}</div>
        </div>
        {dias>=0 && dias<=2 && <Badge texto={dias===0?"hoje":`em ${dias}d`} cor={corPrazo(dias)}/>}
        <button onClick={()=>setEditando(a)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text3)"}}><Icon name="editar" size={14}/></button>
        <button onClick={()=>excluir(a.id)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--text3)"}}><Icon name="excluir" size={14}/></button>
      </div>
    );
  };

  return (
    <div className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{fontSize:30}}>Agenda</h2>
          <div style={{color:"var(--text2)",fontSize:14.5}}>{futuros.length} compromisso(s) futuro(s)</div>
        </div>
        <div style={{display:"flex",gap:10}}>
          {googleToken && (
            <button onClick={sincronizarGoogle} disabled={sincronizando} style={{...btnSecundario,display:"flex",alignItems:"center",gap:7}}>
              <Icon name="sync" size={14}/> {sincronizando?"Sincronizando…":"Sincronizar Google Agenda"}
            </button>
          )}
          <button onClick={()=>setNovo(true)} style={{...btnPrimario,display:"flex",alignItems:"center",gap:7}}>
            <Icon name="mais" size={15} color="#fff"/> Novo compromisso
          </button>
        </div>
      </div>
      {erroSync && <div style={{color:"var(--red)",fontSize:13.5,marginBottom:14}}>{erroSync}</div>}
      {!googleToken && <div style={{background:"var(--bg2)",borderRadius:9,padding:"11px 14px",fontSize:13.5,marginBottom:18}}>Conecte o Google Agenda em <b>Configurações</b> para sincronizar seus compromissos automaticamente.</div>}

      <div style={{background:"var(--card)",borderRadius:12,boxShadow:"var(--shadow)",border:"1px solid var(--border)",overflow:"hidden",marginBottom:24}}>
        {futuros.length===0 && <div style={{padding:26,textAlign:"center",color:"var(--text3)"}}>Nenhum compromisso futuro.</div>}
        {futuros.map(a=><Item key={a.id} a={a}/>)}
      </div>

      {passados.length>0 && (
        <>
          <h4 style={{fontSize:16,color:"var(--text2)",marginBottom:10}}>Passados</h4>
          <div style={{background:"var(--card)",borderRadius:12,boxShadow:"var(--shadow)",border:"1px solid var(--border)",overflow:"hidden",opacity:0.65}}>
            {passados.slice(-10).map(a=><Item key={a.id} a={a}/>)}
          </div>
        </>
      )}

      {(novo||editando) && (
        <ModalFormCompromisso compromisso={editando} processos={processos} clientes={clientes} onSave={salvar} onClose={()=>{setNovo(false);setEditando(null);}}/>
      )}
    </div>
  );
}

// ---------- Página: Intimações (DJEN) ----------
function PaginaIntimacoes({intimacoes,setIntimacoes,processos,setProcessos,oabNumero,oabUf,onAbrirProcesso}){
  const [buscando,setBuscando] = useState(false);
  const [erro,setErro] = useState("");
  const [vinculandoId,setVinculandoId] = useState(null);
  const [criarPrazoDe,setCriarPrazoDe] = useState(null);

  const buscar = async () => {
    setErro(""); setBuscando(true);
    try{
      const encontradas = await buscarIntimacoesDJEN({oabNumero,oabUf,dias:15});
      const jaTemIds = new Set(intimacoes.map(i=>i.id));
      const novas = encontradas.filter(i=>!jaTemIds.has(i.id));
      setIntimacoes(prev=>[...novas,...prev]);
      if(novas.length===0 && encontradas.length===0) setErro("Nenhuma publicação encontrada nos últimos 15 dias para esta OAB.");
    }catch(e){ setErro(e.message||"Erro ao consultar o DJEN."); }
    setBuscando(false);
  };

  const vincular = (intimacaoId, procId) => {
    setIntimacoes(prev=>prev.map(i=>i.id===intimacaoId?{...i,vinculada:true,processoId:procId}:i));
    if(procId){
      const intimacao = intimacoes.find(i=>i.id===intimacaoId);
      setProcessos(ps=>ps.map(p=>p.id===procId?{...p,andamentos:[...(p.andamentos||[]),{data:intimacao.data||fmtDataHoje(),desc:`Publicação DJEN: ${intimacao.texto?.slice(0,200)||"—"}`}]}:p));
    }
    setVinculandoId(null);
  };

  return (
    <div className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{fontSize:30}}>Intimações</h2>
          <div style={{color:"var(--text2)",fontSize:14.5}}>Publicações do Diário de Justiça Eletrônico Nacional (DJEN) para sua OAB</div>
        </div>
        <button onClick={buscar} disabled={buscando} style={{...btnPrimario,display:"flex",alignItems:"center",gap:7}}>
          <Icon name="sync" size={15} color="#fff"/> {buscando?"Buscando…":"Buscar publicações"}
        </button>
      </div>

      {(!oabNumero || !oabUf) && (
        <div style={{background:"var(--bg2)",borderRadius:9,padding:"14px 16px",marginBottom:18,fontSize:14}}>
          Cadastre seu número e UF da OAB em <b>Configurações</b> para habilitar a busca automática de intimações.
        </div>
      )}
      {erro && <div style={{color:"var(--red)",fontSize:14,marginBottom:14}}>{erro}</div>}

      <div style={{background:"var(--card)",borderRadius:12,boxShadow:"var(--shadow)",border:"1px solid var(--border)",overflow:"hidden"}}>
        {intimacoes.length===0 && <div style={{padding:30,textAlign:"center",color:"var(--text3)"}}>Nenhuma intimação carregada ainda.</div>}
        {intimacoes.map((it,i)=>(
          <div key={it.id} style={{padding:"14px 20px",borderBottom:i<intimacoes.length-1?"1px solid var(--border)":"none"}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:12}}>
              <div style={{fontWeight:600,fontSize:14.5}}>{it.orgao}</div>
              <div style={{fontSize:12.5,color:"var(--text3)"}}>{fmtData(it.data)}</div>
            </div>
            {it.numeroProcesso && <div style={{fontSize:12.5,color:"var(--text3)",marginBottom:4}}>{it.numeroProcesso}</div>}
            <div style={{fontSize:14,color:"var(--text2)",marginBottom:8}}>{(it.texto||"").slice(0,240)}{(it.texto||"").length>240?"…":""}</div>
            {it.vinculada ? (
              <Badge texto="vinculada ao processo" cor="var(--green)"/>
            ) : (
              <button onClick={()=>setVinculandoId(it.id)} style={{...btnSecundario,fontSize:12,padding:"6px 11px"}}>Vincular a um processo</button>
            )}
            {vinculandoId===it.id && (
              <div style={{marginTop:10,display:"flex",gap:8}}>
                <select style={{...campoStyle,margin:0,flex:1}} onChange={e=>vincular(it.id, e.target.value)} defaultValue="">
                  <option value="" disabled>Selecione o processo...</option>
                  {processos.map(p=><option key={p.id} value={p.id}>{p.numero||"Processo sem número"}</option>)}
                </select>
                <button onClick={()=>setVinculandoId(null)} style={btnSecundario}>Cancelar</button>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function escaparRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function escaparXml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// Constrói um regex que casa o token mesmo se o Word tiver dividido o texto
// em várias tags (runs) — comum quando o arquivo passa por correção ortográfica.
function construirRegexToken(token){
  const partes = token.split('').map(c => escaparRegex(c) + "(?:<[^>]+>)*");
  return new RegExp(partes.join(''), 'g');
}

async function gerarDocxComDados(templateBase64, substituicoes){
  const zip = await JSZip.loadAsync(templateBase64, {base64:true});
  const caminho = "word/document.xml";
  const arquivo = zip.file(caminho);
  if(!arquivo) throw new Error("Modelo inválido: não encontrei word/document.xml dentro do arquivo.");
  let xml = await arquivo.async("string");
  for(const [token, valor] of Object.entries(substituicoes)){
    const regex = construirRegexToken(token);
    xml = xml.replace(regex, escaparXml(valor));
  }
  zip.file(caminho, xml);
  return zip.generateAsync({type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

// Gera um .docx editável de verdade (não é impressão/PDF) a partir de texto simples,
// inserindo o conteúdo como parágrafos reais dentro do timbrado do escritório.
async function gerarDocxDePecaTexto(texto){
  const zip = await JSZip.loadAsync(TIMBRADO_DOCX_TEMPLATE, {base64:true});
  const caminho = "word/document.xml";
  const arquivo = zip.file(caminho);
  if(!arquivo) throw new Error("Template do timbrado inválido.");
  let xml = await arquivo.async("string");

  const regexToken = construirRegexToken("{{CONTEUDO}}");
  const match = regexToken.exec(xml);
  if(!match) throw new Error("Não encontrei o local de inserção no timbrado.");

  const inicioParagrafo = xml.lastIndexOf("<w:p", match.index);
  const fimTagFechamento = xml.indexOf("</w:p>", match.index);
  if(inicioParagrafo===-1 || fimTagFechamento===-1) throw new Error("Estrutura do timbrado inesperada.");
  const fimParagrafo = fimTagFechamento + "</w:p>".length;

  const linhas = (texto||"").split(/\n/);
  const paragrafosXml = linhas.map(linha => {
    const linhaEscapada = escaparXml(linha);
    return linha.trim()===""
      ? `<w:p/>`
      : `<w:p><w:r><w:t xml:space="preserve">${linhaEscapada}</w:t></w:r></w:p>`;
  }).join("");

  xml = xml.slice(0, inicioParagrafo) + paragrafosXml + xml.slice(fimParagrafo);
  zip.file(caminho, xml);
  return zip.generateAsync({type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

function baixarBlob(blob, nomeArquivo){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

function lerArquivoComoBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function chamarIA(systemPrompt, userContent, comBusca=false){
  if(!supabaseConfigurado){
    throw new Error("A IA neste site precisa do Supabase configurado (veja Configurações) com a Edge Function 'gemini-proxy' publicada.");
  }
  const body = {
    systemPrompt,
    userContent,
    comBusca,
  };
  const resp = await fetch(`${SUPABASE_URL}/functions/v1/gemini-proxy`, {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_ANON_KEY}`},
    body: JSON.stringify(body)
  });
  const data = await resp.json();
  const texto = data?.candidates?.[0]?.content?.parts?.map(p=>p.text).filter(Boolean).join("\n") || "";
  const chunks = data?.candidates?.[0]?.groundingMetadata?.groundingChunks || [];
  const fontes = chunks
    .filter(c=>c.web?.uri)
    .map(c=>({titulo:c.web.title||c.web.uri, url:c.web.uri}));
  return {texto: texto || (data?.error?.message ? `Erro: ${data.error.message}` : "Não foi possível gerar o conteúdo. Tente novamente."), fontes};
}

function CartaoDocumento({tipo, modelo, onUpload, clientes, processos, sindicancias, peps, config}){
  const [clienteId,setClienteId] = useState("");
  const [itemId,setItemId] = useState("");
  const [gerando,setGerando] = useState(false);
  const [erro,setErro] = useState("");
  const inputRef = useRef(null);

  const listaVinculada = tipo.colecao==="peps"?peps : tipo.colecao==="sindicancias"?sindicancias : tipo.colecao==="processos"?processos : [];

  const escolherArquivo = async (e) => {
    const file = e.target.files?.[0];
    if(!file) return;
    if(!file.name.toLowerCase().endsWith(".docx")){ setErro("Envie um arquivo .docx (Word)."); return; }
    setErro("");
    const base64 = await lerArquivoComoBase64(file);
    onUpload(tipo.id, {nomeArquivo:file.name, base64, enviadoEm:fmtDataHoje()});
    e.target.value = "";
  };

  const gerar = async () => {
    if(!clienteId){ setErro("Selecione o cliente."); return; }
    setErro(""); setGerando(true);
    try{
      const cliente = clientes.find(c=>c.id===clienteId);
      const itemVinculado = listaVinculada.find(i=>i.id===itemId) || null;
      const substituicoes = montarSubstituicoes({cliente, itemVinculado, tipoDoc:tipo, config});
      const blob = await gerarDocxComDados(modelo.base64, substituicoes);
      const nomeSaida = `${tipo.nome} - ${cliente.nome}.docx`;
      baixarBlob(blob, nomeSaida);
    }catch(e){
      setErro(e.message || "Erro ao gerar o documento. Verifique se o modelo enviado é um .docx válido.");
    }
    setGerando(false);
  };

  return (
    <div style={{background:"var(--card)",borderRadius:12,padding:"20px 22px",boxShadow:"var(--shadow)",border:"1px solid var(--border)"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>

          <button onClick={()=>inputRef.current.click()} style={{...btnSecundario,display:"flex",alignItems:"center",gap:7}}>
            <Icon name="mais" size={14}/> Enviar modelo (.docx)
          </button>
        </div>
      )}

      {modelo && (
        <>
          <div style={{fontSize:12.5,color:"var(--text3)",marginBottom:14,display:"flex",alignItems:"center",gap:8}}>
            <Badge texto="modelo enviado" cor="var(--green)"/> {modelo.nomeArquivo}
            <input ref={inputRef} type="file" accept=".docx" onChange={escolherArquivo} style={{display:"none"}}/>
            <span onClick={()=>inputRef.current.click()} style={{cursor:"pointer",color:"var(--navy)",fontWeight:600,fontSize:12}}>trocar</span>
          </div>

          <label style={labelStyle}>Cliente</label>
          <select style={campoStyle} value={clienteId} onChange={e=>setClienteId(e.target.value)}>
            <option value="">Selecione...</option>
            {clientes.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
          </select>

          {tipo.colecao && (
            <>
              <label style={labelStyle}>{tipo.nome.includes("PEP")?"PEP":tipo.nome.includes("Sindicância")?"Sindicância":"Processo"} vinculado (opcional)</label>
              <select style={campoStyle} value={itemId} onChange={e=>setItemId(e.target.value)}>
                <option value="">Nenhum</option>
                {listaVinculada.map(i=><option key={i.id} value={i.id}>{i.numero||"sem número"}</option>)}
              </select>
            </>
          )}

          {erro && <div style={{color:"var(--red)",fontSize:12.5,marginBottom:10}}>{erro}</div>}

          <button onClick={gerar} disabled={gerando} style={{...btnPrimario,width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginTop:4}}>

          </button>
        </>
      )}
    </div>
  );
}
